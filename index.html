<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<title>Chakra E-Trans | Driver Phone Book</title>
<style>
  :root{--bg:#f3f6fb;--card:#fff;--text:#0b2545;--muted:#5b6b82;--line:#e1e6ee;--navy:#0b2545;--accent:#1e6fd9;
        --ok:#0f7b3f;--okbg:#dcf5e5;--no:#a12b2b;--nobg:#fbe0e0;--wa:#1faa59;--shadow:0 2px 10px rgba(11,37,69,.08);--chip:#eef2f8}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1420;--card:#152033;--text:#e8eef8;--muted:#91a1b8;--line:#25344d;--accent:#6fb0ff;
        --ok:#7fe0a3;--okbg:#14401f;--no:#ff9b9b;--nobg:#4a1c1c;--shadow:none;--chip:#1d2b43}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;
       padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
  button,a{touch-action:manipulation}
  header{background:linear-gradient(135deg,#0b2545,#13407a);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 16px}
  .hin{max-width:1000px;margin:0 auto}
  header h1{margin:0;font-size:1.2rem;line-height:1.25}
  header p{margin:3px 0 0;font-size:.8rem;opacity:.8}
  main{max-width:1000px;margin:0 auto;padding:14px 14px 90px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
  .stat b{display:block;font-size:1.5rem;line-height:1.1}
  .stat span{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .stat.a b{color:var(--ok)} .stat.i b{color:var(--no)}

  .tools{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 8px;margin:0 0 4px}
  .row1{display:flex;gap:8px;margin-bottom:8px}
  #q{flex:1;min-width:0;height:48px;padding:0 14px;font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);-webkit-appearance:none;appearance:none}
  #q:focus{outline:2px solid var(--accent);border-color:transparent}
  #rf{flex:none;height:48px;min-width:48px;padding:0 14px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;cursor:pointer;font:inherit;font-weight:700;font-size:1.1rem}
  #rf:active{background:var(--chip)} #rf:disabled{opacity:.5}
  #rf .t{display:none;font-size:.9rem;margin-left:6px}
  .seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
  .seg button{flex:1;height:44px;border:0;background:transparent;cursor:pointer;font:inherit;font-weight:700;font-size:.8rem;color:var(--muted);padding:0 4px}
  .seg button small{font-weight:600;opacity:.8}
  .seg button.on{background:var(--navy);color:#fff}
  .count{font-size:.8rem;color:var(--muted);margin:6px 2px}

  .wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%}
  th,td{padding:11px 14px;text-align:left;font-size:.92rem;border-bottom:1px solid var(--line)}
  th{background:var(--navy);color:#fff;font-weight:600;font-size:.78rem;letter-spacing:.4px}
  tbody tr{transition:background .15s} tbody tr:hover{background:rgba(30,111,217,.07)}
  tbody tr:last-child td{border-bottom:0}
  .num{color:var(--muted)} .nm{font-weight:600}
  a.tel{color:var(--accent);text-decoration:none;font-weight:700;font-variant-numeric:tabular-nums}
  .badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.7rem;font-weight:700;white-space:nowrap}
  .ACTIVE{background:var(--okbg);color:var(--ok)} .INACTIVE{background:var(--nobg);color:var(--no)}
  .act{display:flex;gap:6px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:10px;text-decoration:none;font-size:.82rem;font-weight:700;color:#fff;transition:transform .1s,opacity .15s}
  .btn:hover{opacity:.9;transform:translateY(-1px)} .btn:active{transform:scale(.97)}
  .call{background:var(--accent)} .wa{background:var(--wa)}
  .call svg,.wa svg{width:18px;height:18px;fill:currentColor;flex:none}

  /* mobile cards */
  .card{padding:14px;border-bottom:1px solid var(--line)} .card:last-child{border-bottom:0}
  .ct{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .cn{font-weight:700;font-size:1.05rem;line-height:1.25;overflow-wrap:anywhere;min-width:0}
  .chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .chip{background:var(--chip);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:.74rem;font-weight:600}
  .card .tel{display:block;margin:10px 0 10px;font-size:1.25rem;letter-spacing:.5px}
  .card .act{gap:8px}
  .card .act .btn{flex:1;height:48px;font-size:.95rem;border-radius:12px}

  .state{padding:40px 16px;text-align:center;color:var(--muted)}
  .spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .err{color:var(--no)}
  .err button{margin-top:12px;height:44px;padding:0 20px;border-radius:10px;border:1px solid var(--no);background:transparent;color:var(--no);cursor:pointer;font:inherit;font-weight:700}

  #top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:1.2rem;box-shadow:0 4px 14px rgba(0,0,0,.3);display:none;cursor:pointer;z-index:30}
  #top.show{display:block}

  @media (min-width:761px){
    main{padding:18px 16px 40px}
    .stat b{font-size:1.7rem} .stat span{font-size:.75rem}
    .tools{position:static;display:flex;gap:8px;padding:0;margin-bottom:6px}
    .row1{flex:1;margin:0} .seg button{padding:0 16px;flex:none}
    #q,#rf,.seg{height:44px} .seg button{height:42px}
    #rf .t{display:inline} #top{display:none!important}
  }
  @media (max-width:360px){
    .seg button small{display:none} .stat b{font-size:1.3rem}
  }
</style>
</head>
<body>
<header><div class="hin">
  <h1>Chakra E-Trans | Driver Phone Book</h1>
  <p>Live from Google Sheets</p>
</div></header>

<main>
  <section class="stats">
    <div class="stat"><b id="sT">–</b><span>Total</span></div>
    <div class="stat a"><b id="sA">–</b><span>Active</span></div>
    <div class="stat i"><b id="sI">–</b><span>Inactive</span></div>
  </section>

  <div class="tools">
    <div class="row1">
      <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="Search name, ID, mobile, SL.NO" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Search drivers">
      <button id="rf" aria-label="Refresh">↻<span class="t">Refresh</span></button>
    </div>
    <div class="seg" id="seg">
      <button data-f="ALL" class="on">ALL <small id="cAll"></small></button>
      <button data-f="ACTIVE">ACTIVE <small id="cAct"></small></button>
      <button data-f="INACTIVE">INACTIVE <small id="cIn"></small></button>
    </div>
  </div>

  <p class="count" id="count"></p>
  <div class="wrap" id="wrap"></div>
</main>
<button id="top" aria-label="Back to top">↑</button>

<script>
/* Existing Apps Script Web App endpoint (data source) */
const API_URL = 'https://script.google.com/macros/s/AKfycbzNjcVzAuFApHEWhoiAyw3YaP69Gh0SOX7yzJ_ANDEkwKEdbTn6JNVPL9_9bCkEK7bSaA/exec';

let ALL = [], FILTER = 'ALL';
const $ = id => document.getElementById(id);
const mq = window.matchMedia('(max-width: 760px)');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ICON_CALL = '<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
const ICON_WA = '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.4.6-.3.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></svg>';

/* POST text/plain (no preflight) -> Apps Script redirect -> readable JSON; fallback GET ?action=getAllDrivers */
async function fetchDrivers() {
  const attempts = [
    () => fetch(API_URL, { method: 'POST', redirect: 'follow',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'getAllDrivers', args: [] }) }),
    () => fetch(API_URL + '?action=getAllDrivers&_=' + Date.now(), { method: 'GET', redirect: 'follow' })
  ];
  let lastErr;
  for (const go of attempts) {
    try {
      const r = await go();
      const text = await r.text();
      let data;
      try { data = JSON.parse(text); } catch (e) { throw new Error('Server did not return JSON. Check the deployment access is set to "Anyone".'); }
      if (!data || data.ok !== true || !Array.isArray(data.drivers)) throw new Error((data && data.message) || 'Unexpected response from server.');
      return data.drivers;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('Connection failed.');
}

function normalize(list) {
  const seen = new Set(), out = [];
  list.forEach(d => {
    const id = String(d.id == null ? '' : d.id).trim();
    if (!id || seen.has(id.toUpperCase())) return;
    seen.add(id.toUpperCase());
    out.push({
      sl: String(d.sl == null ? '' : d.sl).trim(),
      id: id,
      name: String(d.name == null ? '' : d.name).trim(),
      mobile: String(d.mobile == null ? '' : d.mobile).trim(),
      status: String(d.status || '').trim().toUpperCase() === 'ACTIVE' ? 'ACTIVE' : 'INACTIVE'
    });
  });
  return out;
}

const telNum = m => m.replace(/[^\d+]/g, '');
function waLink(m) {
  const digits = m.replace(/\D/g, '');
  if (!digits) return '';
  return 'https://wa.me/' + (digits.length === 10 ? '91' + digits : digits);
}
function actions(d) {
  const tel = telNum(d.mobile), wa = waLink(d.mobile);
  if (!tel) return '<span class="num">–</span>';
  return '<div class="act"><a class="btn call" href="tel:' + esc(tel) + '">' + ICON_CALL + 'Call</a>' +
         (wa ? '<a class="btn wa" href="' + esc(wa) + '" target="_blank" rel="noopener">' + ICON_WA + 'WhatsApp</a>' : '') + '</div>';
}
const telLink = d => d.mobile ? '<a class="tel" href="tel:' + esc(telNum(d.mobile)) + '">' + esc(d.mobile) + '</a>' : '<span class="num">No number</span>';

function stats() {
  const a = ALL.filter(d => d.status === 'ACTIVE').length;
  $('sT').textContent = ALL.length; $('sA').textContent = a; $('sI').textContent = ALL.length - a;
  $('cAll').textContent = '(' + ALL.length + ')'; $('cAct').textContent = '(' + a + ')'; $('cIn').textContent = '(' + (ALL.length - a) + ')';
}

function render() {
  const q = $('q').value.trim().toLowerCase();
  const rows = ALL.filter(d => (FILTER === 'ALL' || d.status === FILTER) &&
    (!q || [d.sl, d.id, d.name, d.mobile].join(' ').toLowerCase().indexOf(q) >= 0));
  $('count').textContent = 'Showing ' + rows.length + ' of ' + ALL.length + ' drivers';
  if (!rows.length) {
    $('wrap').innerHTML = '<div class="state">' + (ALL.length ? 'No drivers match your search or filter.' : 'No drivers available.') + '</div>';
    return;
  }
  if (mq.matches) {
    $('wrap').innerHTML = rows.map(d =>
      '<div class="card"><div class="ct"><div style="min-width:0"><div class="cn">' + esc(d.name || '(no name)') + '</div>' +
      '<div class="chips"><span class="chip">SL ' + esc(d.sl) + '</span><span class="chip">ID ' + esc(d.id) + '</span></div></div>' +
      '<span class="badge ' + d.status + '">' + d.status + '</span></div>' + telLink(d) + actions(d) + '</div>').join('');
  } else {
    $('wrap').innerHTML = '<table><thead><tr><th>SL.NO</th><th>DRIVER ID</th><th>DRIVER NAME</th><th>MOBILE NO</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody>' +
      rows.map(d => '<tr><td class="num">' + esc(d.sl) + '</td><td>' + esc(d.id) + '</td><td class="nm">' + esc(d.name) + '</td><td>' + telLink(d) +
      '</td><td><span class="badge ' + d.status + '">' + d.status + '</span></td><td>' + actions(d) + '</td></tr>').join('') + '</tbody></table>';
  }
}

async function load() {
  $('wrap').innerHTML = '<div class="state"><div class="spin"></div>Fetching drivers from Google Sheets…</div>';
  $('count').textContent = '';
  $('rf').disabled = true;
  try {
    ALL = normalize(await fetchDrivers());
    stats(); render();
  } catch (e) {
    $('wrap').innerHTML = '<div class="state err"><b>Could not load drivers.</b><br>' + esc(e.message || e) +
      '<br><button onclick="load()">Try again</button></div>';
  } finally { $('rf').disabled = false; }
}

$('q').addEventListener('input', render);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  FILTER = b.dataset.f;
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
$('rf').addEventListener('click', load);
(mq.addEventListener ? mq.addEventListener('change', render) : mq.addListener(render));
window.addEventListener('scroll', () => $('top').classList.toggle('show', window.scrollY > 500), { passive: true });
$('top').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
load();
</script>
</body>
</html>
